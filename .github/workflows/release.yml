name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - run: pnpm run check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 安装

            ```sh
            # Web / CLI profile
            dsh plugin --profile web add github:AlienGene/dsh-workspace-tags
            ```

            桌面版请先完全退出 App，再用 App 自带 CLI 安装，然后重新打开：

            ```sh
            "/Applications/DeepSeek Harness.app/Contents/Resources/runtime/cli/bin/dsh" \
              plugin --profile desktop add github:AlienGene/dsh-workspace-tags
            ```

            已针对 DeepSeek Harness `0.2.1-rc.5` 验证。仓库内已提交 `lib/` 与 `client/` 构建产物，安装时不需要本地构建。
